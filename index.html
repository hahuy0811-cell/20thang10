function bloom(type,hue,id,stem=true){return `<svg viewBox="0 0 180 ${stem?530:180}" aria-hidden="true"><defs><linearGradient id="leaf${id}" x2="1" y2="1"><stop stop-color="#87ad6e"/><stop offset=".45" stop-color="#31814e"/><stop offset="1" stop-color="#145d38"/></linearGradient></defs>${stem?`<path d="M91 1100 Q76 324 90 102" fill="none" stroke="#2f6840" stroke-width="4"/><path d="M92 1100 Q77 324 91 122" fill="none" stroke="#a0b66f" stroke-width="1"/><path d="M86 320 l-8 -9 9 3 M84 260 l9 -10 -9 4 M89 416 l9 -11 -10 5" fill="#53794a"/><path d="M85 286 Q42 285 34 249 Q67 243 85 286 M84 226 Q128 227 139 184 Q106 180 84 226 M87 370 Q46 359 45 330 Q77 332 87 370" fill="url(#leaf${id})"/><path d="M38 252 L85 286 M135 188 L84 226 M48 334 L87 370" stroke="#a3bc7e" stroke-width=".6" fill="none"/>`:''}<image class="head" href="rose.png" x="5" y="5" width="170" height="170"/></svg>`}

// distant stems, then middle ground and foreground; one species throughout
for(let i=0;i<24;i++){let x=((i*37)%101)-5;flowers.push([x,8+(i%4)*1.4,1+(i%3)*2,42+(i*17)%34,'rose',345]);}
for(let i=0;i<18;i++){let x=((i*29+7)%108)-7;flowers.push([x,13+(i%4)*2,-4+(i%3)*2,43+(i*13)%31,'rose',345]);}
for(let i=0;i<13;i++){let x=((i*31+3)%110)-9;flowers.push([x,21+(i%3)*3,-14+(i%4)*2,45+(i*11)%24,'rose',345]);}
flowers.push([29,42,-1,94,'rose',345]);
let selected=0;const garden=document.querySelector('#garden');flowers.forEach((f,i)=>{const b=document.createElement('button');b.className='flower';b.style=`--x:${f[0]}%;--w:${f[1]}%;--b:${f[2]}%;--h:${f[3]}%;--t:${3.5+i*.23}s;animation-delay:-${i*.4}s;z-index:${i+1}`;b.innerHTML=bloom(f[4],f[5],i);b.onpointerdown=()=>b.classList.add("pressing");b.onpointerup=b.onpointerleave=()=>b.classList.remove("pressing");if(i<24)b.style.filter='blur(.7px) saturate(.8)';if(i===flowers.length-1)b.classList.add('hero-rose');b.setAttribute('aria-label',`Chọn bông ${f[4]==='rose'?'hồng':f[4]==='tulip'?'tulip':'cúc'} số ${i+1} để nhận lời chúc`);b.onclick=(e)=>{if(b.classList.contains("picked"))return;selected=i;touchBloom(b,e);document.querySelector('#cardFlower').innerHTML=bloom(f[4],f[5],'card',false);nextWish();setTimeout(()=>openCard(b),650)};garden.append(b)});
const wishes=['Chúc bạn 20/10 xinh như hoa, tiền đầy ví, còn deadline thì tự biết đường biến mất!','Chúc bạn nhan sắc thăng hạng, lương tăng đều đều, còn cân nặng thì biết giữ bí mật!','Hôm nay bạn cứ việc tỏa sáng. Việc nhà cứ để… ngày mai tính! Chúc bạn 20/10 thật vui!','Chúc bạn luôn được cưng như công chúa, ăn ngon không cần đắn đo, mua đồ không cần chờ sale!','Chúc bạn có làn da đẹp, giấc ngủ ngon và tài khoản ngân hàng chăm chỉ nở hoa hơn cả khu vườn này!','Chúc bạn sáng mở mắt thấy vui, mở ví thấy tiền, mở tin nhắn thấy toàn lời yêu thương!','20/10 chúc bạn đẹp không cần filter, vui không cần lý do, giàu không cần… đợi kiếp sau!','Chúc mọi muộn phiền của bạn đều nhẹ như số cân bạn mong muốn, còn niềm vui thì nặng như vali đi du lịch!','Mong bạn luôn gặp người tử tế, đồ ăn hợp khẩu vị và shipper gọi đúng lúc đang đói. Happy 20/10!','Chúc bạn một ngày không họp dài, không việc gấp, không ai hỏi “bao giờ…” — chỉ toàn hoa và quà!','Chúc bạn luôn rạng rỡ như nắng, dịu dàng như mây, và mạnh mẽ khi bấm nút “thanh toán”!','20/10, chúc bạn được yêu thương đủ đầy. Nếu chưa có ai tặng hoa thì cả khu vườn này là của bạn!','Chúc bạn tiền vào như nước, niềm vui như mưa, còn drama thì xin phép: không có nhu cầu nhận hàng!','Chúc bạn hôm nay cười nhiều hơn lướt điện thoại, nhận quà nhiều hơn nhận việc và luôn được là chính mình!','Chúc bạn hạnh phúc bền lâu, son môi không trôi và người thương luôn nhớ: bạn thích ăn gì!','Chúc bạn luôn xinh đẹp theo cách của mình. Hoa còn có nhiều loại, bạn đâu cần giống bất kỳ ai!','Hôm nay vũ trụ nhắn: bạn xứng đáng với hoa đẹp, món ngon và một ngày không cần làm người lớn!','Chúc bạn đi làm được quý, về nhà được thương, đi chơi có ảnh đẹp ngay từ lần chụp đầu tiên!','Chúc bạn 20/10 tràn đầy năng lượng tích cực, trừ năng lượng phải dùng để trả lời “em đang làm gì đấy?”!','Chúc bạn một ngày thật ngọt ngào. Trà sữa có thể ít đường, nhưng cuộc đời phải thật nhiều yêu thương!'];let bag=[],last=-1;function nextWish(){if(!bag.length){bag=wishes.map((_,i)=>i);for(let i=bag.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}if(bag.at(-1)===last)[bag[0],bag[bag.length-1]]=[bag[bag.length-1],bag[0]]}last=bag.pop();document.querySelector('#wish').textContent=wishes[last]}
const veil=document.querySelector('#veil');let returnFocus;function openCard(b){returnFocus=b;veil.classList.add('open');document.body.style.overflow='hidden';document.querySelector('.close').focus({preventScroll:true})}function closeCard(){veil.classList.remove('open');document.body.style.overflow='';returnFocus?.focus({preventScroll:true})}document.querySelector('.close').onclick=closeCard;veil.onclick=e=>{if(e.target===veil)closeCard()};document.addEventListener('keydown',e=>{if(!veil.classList.contains('open'))return;if(e.key==='Escape')closeCard();if(e.key==='Tab'){const a=[...veil.querySelectorAll('button')];if(e.shiftKey&&document.activeElement===a[0]){e.preventDefault();a.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===a.at(-1)){e.preventDefault();a[0].focus()}}});document.querySelector('#chooseMore').onclick=closeCard;let timer;function toast(t){const el=document.querySelector('#toast');el.textContent=t;el.style.display='block';clearTimeout(timer);timer=setTimeout(()=>el.style.display='none',2400)}for(let i=0;i<20;i++){const m=document.createElement('i');m.className='mote';m.style=`left:${(i*37)%100}%;top:${35+(i*13)%60}%;animation-delay:-${i*.7}s`;document.querySelector('.world').append(m)}for(let i=0;i<7;i++){const p=document.createElement('i');p.className='petal';p.style=`top:0;left:${i*17}%;animation-delay:${i*1.7}s;animation-duration:${9+i}s`;document.querySelector('.world').append(p)}

function touchBloom(b,e){b.classList.add('picked');setTimeout(()=>b.classList.remove('picked'),900);const rect=b.querySelector('.head').getBoundingClientRect();const x=e.clientX||rect.x+rect.width/2,y=e.clientY||rect.y+rect.height/2;const ring=document.createElement('i');ring.className='touch-ring';ring.style=`left:${x}px;top:${y}px`;document.body.append(ring);setTimeout(()=>ring.remove(),900);for(let j=0;j<12;j++){const p=document.createElement('i');p.className='burst-petal';let a=j*Math.PI/6;p.style=`left:${x}px;top:${y}px;--dx:${Math.cos(a)*(60+Math.random()*65)}px;--dy:${Math.sin(a)*70+45}px;--rot:${j*50}deg`;document.body.append(p);setTimeout(()=>p.remove(),1400)}if(navigator.vibrate)navigator.vibrate(15)}
const grass=document.querySelector('#grass');let blades='';for(let j=0;j<230;j++){let x=(j*47)%910,h=10+(j*19)%60,y=110+(j*7)%45;blades+=`<path d="M${x} ${y} Q${x-3} ${y-h*.65} ${x-10+(j%20)} ${y-h}" fill="none" stroke="${['#486c3e','#62864a','#8aaa5c','#c4cc7e'][j%4]}" stroke-width="${1+j%2}"/>`}for(let j=0;j<60;j++){let x=(j*67)%900,y=100+(j*13)%50;blades+=`<ellipse cx="${x}" cy="${y}" rx="${1+j%3}" ry="1" fill="#d3ce9977"/>`}grass.innerHTML=blades;
</script></body></html>
